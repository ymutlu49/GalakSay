name: Canlı kopyayı yayınla (galaksay.com)

# canli-surum/site klasörünü Cloudflare Pages'e yükler. Elle çalıştırılır.
#   hedef = onizleme → https://onizleme.galaksay.pages.dev (üretimi etkilemez)
#   hedef = main     → galaksay.com
on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "onizleme ya da main"
        required: true
        default: onizleme
      lisans_kapisi:
        description: "kapali (herkes oynar) ya da acik (NuMap hesabı ya da aile daveti gerekir)"
        required: false
        default: kapali

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: 0eec8b88e11ef882d9269249ad00e331

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kopya bütünlük denetimi
        run: |
          set -e
          test -f canli-surum/site/index.html
          test -f canli-surum/site/oyna/index.html
          test -f canli-surum/site/_headers
          grep -q "position: relative; transition" canli-surum/site/oyna/index.html
          # oyna/index.html'deki her varlık klasörde olmalı
          for f in $(grep -o '/oyna/assets/[^"]*' canli-surum/site/oyna/index.html); do test -f "canli-surum/site$f" || { echo "EKSİK: $f"; exit 1; }; done
          find canli-surum/site -type f | wc -l
      - name: Hesap ayarı (isteğe bağlı)
        # Depo değişkeni FIREBASE_API_KEY tanımlıysa e-posta doğrulamalı yetişkin hesabı etkinleşir.
        # Bu anahtar gizli değildir (tarayıcıya gider); yine de biçimi denetlenir.
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          set -e
          if [ -n "$FIREBASE_API_KEY" ]; then
            echo "$FIREBASE_API_KEY" | grep -Eq '^[A-Za-z0-9_-]{30,60}$' || { echo "FIREBASE_API_KEY biçimi geçersiz"; exit 1; }
            printf "window.GALAKSAY_HESAP = { apiKey: '%s' };\n" "$FIREBASE_API_KEY" > canli-surum/site/oyna/hesap-ayar.js
            sed -i "s/const VERSION = '\([^']*\)'/const VERSION = '\1-hesap'/" canli-surum/site/sw.js
            echo "Hesap sistemi etkin."
          else
            echo "FIREBASE_API_KEY tanımlı değil: hesap sistemi kapalı, giriş cihaz şifresiyle."
          fi
      - name: Lisans kapısı
        # canli-surum/functions (Pages Functions) her yayında gider. Kapı kapalıyken yalnız /api/lisans/*
        # çalışır; /oyna/ bugünkü gibi herkese açıktır. Açıkken /oyna/ lisans çerezi ister.
        env:
          KAPI: ${{ inputs.lisans_kapisi }}
        run: |
          set -e
          if [ "$KAPI" = "acik" ]; then
            printf 'export const KAPI_ACIK = true;\n' > canli-surum/functions/_ayar.js
            echo '{"version":1,"include":["/api/lisans/*","/oyna","/oyna/","/oyna/index.html"],"exclude":[]}' > canli-surum/site/_routes.json
            sed -i "s/const VERSION = '\([^']*\)'/const VERSION = '\1-kapi'/" canli-surum/site/sw.js
            echo "Lisans kapısı AÇIK."
          else
            echo "Lisans kapısı kapalı: /oyna/ herkese açık."
          fi
          cat canli-surum/functions/_ayar.js canli-surum/site/_routes.json
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: canli-surum
          command: pages deploy site --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'galaksay' }} --branch ${{ inputs.hedef }} --commit-dirty=true
