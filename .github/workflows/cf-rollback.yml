name: Cloudflare Pages geri alma (rollback)

# Elle çalıştırılır: galaksay.com üretim dağıtımını daha önceki bir dağıtıma geri alır.
# deployment_id: "Cloudflare Pages teşhis" iş akışının listesindeki tam dağıtım kimliği
# (ör. 104bd678-0760-4b95-bab2-9418d0b13932).

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Geri dönülecek Pages dağıtım kimliği
        required: true

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: 0eec8b88e11ef882d9269249ad00e331

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Rollback
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'galaksay' }}
          DEP: ${{ inputs.deployment_id }}
        run: |
          set -e
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$DEP/rollback")
          echo "$resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("success:", d.get("success")); print("errors:", d.get("errors")); r=d.get("result") or {}; print("id:", r.get("id")); print("url:", r.get("url"))'
          echo "$resp" | python3 -c 'import sys,json; sys.exit(0 if json.load(sys.stdin).get("success") else 1)'
