name: Deploy to Cloudflare Pages (galaksay.com)

# main'e her push'ta galaksay.com (Cloudflare Pages) otomatik güncellenir.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — "Cloudflare Pages: Edit" izinli API token
# Hesap kimliği sır değildir; aşağıdaki env.CF_ACCOUNT_ID ile sabitlenmiştir.
# Elle çalıştırma: Actions sekmesi → bu iş akışı → "Run workflow".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Cloudflare hesap kimliği gizli bir değer değildir (wrangler whoami çıktısı); yalnız API token sırdır.
  CF_ACCOUNT_ID: 0eec8b88e11ef882d9269249ad00e331

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Kalite kapısı: lint (0 hata) + 79 birim testi; sonra derleme
      - run: npm run lint
      - run: npm test
      # scripts/build-cf.mjs → cf-deploy/ (landing kökte, uygulama /oyna/, PWA varlıkları)
      - run: npm run build:cf
        env:
          VITE_NUMAP_API: ${{ vars.VITE_NUMAP_API || 'https://getnumap.com/api' }}
      # Sırlar henüz girilmemişse dağıtım adımı atlanır; iş akışı yeşil kalır.
      - id: cf
        run: echo "enabled=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cf.outputs.enabled != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN tanımlı değil — galaksay.com dağıtımı atlandı."
      # Teşhis: token hangi hesabı görüyor (wrangler whoami) ve hangi Pages projeleri var.
      # whoami'ye accountId verilmez; böylece token yanlış hesaba bağlıysa günlükte doğru kimlik görünür.
      - if: steps.cf.outputs.enabled == 'true'
        name: Cloudflare hesabı ve Pages projeleri
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: whoami
      - if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages project list
      - if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          # Proje adı depo değişkeni CLOUDFLARE_PAGES_PROJECT ile değiştirilebilir (varsayılan: galaksay)
          command: pages deploy cf-deploy --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'galaksay' }} --branch main
